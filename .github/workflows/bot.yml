name: Run Telegram Bot with Auto-Save

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fix Database File Permissions
        run: |
          touch bot.sqlite3
          chmod 777 bot.sqlite3 || true
          chmod 777 . || true

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_ID }}
        run: |
          python telegram_bot.py

      - name: Auto-Save Database
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add bot.sqlite3
          git diff-index --quiet HEAD || (git commit -m "Auto-save DB on exit [skip ci]" && git pull --rebase origin main && git push origin main)
          

name: Run Telegram Bot with Auto-Save

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */5 * * *' # تشغيل مجدول كل 5 ساعات ونصف

# منع تشغيل جلستين معاً، والانتظار حتى انتهاء الحالية لحفظ البيانات
concurrency:
  group: telegram-bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install python-telegram-bot; fi

      - name: Run Bot (Safe 5h Session)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_ID }}
        run: |
          # تشغيل لمدة 5 ساعات (18000 ثانية) مع إنهاء هادئ يتيح لـ SQLite إتمام الكتابة
          timeout -s SIGINT 18000s python telegram_bot.py || true

      - name: Auto-Save Database
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add bot.sqlite3
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-save DB on exit [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          else
            echo "No changes in database to commit."
          fi

      - name: Trigger Next Session (24/7 Loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          gh workflow run "Run Telegram Bot with Auto-Save" || true
